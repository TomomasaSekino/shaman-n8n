name: SHAMAN | macOS n8n自動配備

# 人間のmain宛PRのマージだけが配備トリガー。push/PR作成/手動起動では実行しない。
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shaman-macos-main-deploy
  cancel-in-progress: false

jobs:
  stage-test:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.merged_by.login == github.repository_owner &&
          github.event.pull_request.merged_by.type == 'User' &&
          github.event.sender.login == github.repository_owner &&
          github.event.sender.type == 'User' }}
    runs-on: [self-hosted, macOS, X64, shaman-deploy]
    timeout-minutes: 15
    # CredentialのIDはRepository Variableに登録しない。配備のスクリプトがn8nのCredentialの一覧から、
    # 種類で1件に決めて取る（同じ種類が2件以上のときだけ名前で選ぶ）。SHAMAN/IMGのIDはSHAMAN/config/drive.jsonに置く。
    env:
      N8N_BASE_URL: http://127.0.0.1:5678
      SHAMAN_QUEUE_SPREADSHEET_ID: ${{ vars.SHAMAN_QUEUE_SPREADSHEET_ID }}
      SHAMAN_QUEUE_TEST_SPREADSHEET_ID: ${{ vars.SHAMAN_QUEUE_TEST_SPREADSHEET_ID }}
      SHAMAN_DRAFT_DIR: ${{ vars.SHAMAN_DRAFT_DIR }}
      SHAMAN_MERGED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SHAMAN_MERGED_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: luna専用runnerと配備前提を検証
        shell: bash
        env:
          N8N_DEPLOY_API_KEY: ${{ secrets.N8N_DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != "luna-shaman-deploy" ]; then
            echo "::error title=配備前提 R01::想定外のrunnerです"
            exit 1
          fi
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error title=配備前提 R02::rootユーザーによる配備は禁止です"
            exit 1
          fi
          # 存在が確認されていない独自のmarkerファイルには依存しない。
          # 専用runner、ユーザー、権限隔離、ローカル接続で配備元を制限する。
          if [ -e /etc/shaman-ci-isolated ]; then
            echo "::error title=配備前提 R03::CI隔離環境での配備を禁止します"
            exit 1
          fi
          if sudo -n true >/dev/null 2>&1; then
            echo "::error title=配備前提 R04::runnerにパスワードなしsudo権限があります"
            exit 1
          fi
          if [ -z "${N8N_DEPLOY_API_KEY:-}" ]; then
            echo "::error title=配備前提 R05::GitHub Secret N8N_DEPLOY_API_KEYが未登録です"
            exit 1
          fi
          if [ -z "${SHAMAN_QUEUE_TEST_SPREADSHEET_ID:-}" ]; then
            echo "::error title=配備前提 R06::試験用Spreadsheet IDが未登録です"
            exit 1
          fi
          if [ -z "${SHAMAN_DRAFT_DIR:-}" ]; then
            echo "::error title=配備前提 R08::下書き保存先SHAMAN_DRAFT_DIRが未登録です"
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 5 "$N8N_BASE_URL/healthz" >/dev/null; then
            echo "::error title=配備前提 R09::luna上のn8n localhost:5678に接続できません"
            exit 1
          fi
          echo "SHAMAN_DEPLOY_PREFLIGHT_OK"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: マージしたmainのコミットを確認
        shell: bash
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
          test "$GITHUB_SHA" = "$MERGED_SHA"
          main_sha="$(curl --fail --silent --show-error --max-time 10 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_READ_TOKEN" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$main_sha" = "$MERGED_SHA"
      - name: 本番の同時実行を1件に制限していることを確認
        shell: bash
        run: |
          set -euo pipefail
          # SHAMAN以外のn8nワークフローにも影響する。既存のLaunchDaemonを書き換えず読み取りだけ。
          python3 - <<'PY'
          import plistlib
          path = '/Library/LaunchDaemons/com.shaman.n8n.plist'
          try:
              with open(path, 'rb') as f:
                  config = plistlib.load(f)
          except (OSError, ValueError) as exc:
              raise SystemExit('SHAMAN_CONCURRENCY_PREFLIGHT_NG: n8n LaunchDaemonの設定を読めません: ' + type(exc).__name__)
          value = str((config.get('EnvironmentVariables') or {}).get('N8N_CONCURRENCY_PRODUCTION_LIMIT', ''))
          if value != '1':
              raise SystemExit('SHAMAN_CONCURRENCY_PREFLIGHT_NG: N8N_CONCURRENCY_PRODUCTION_LIMIT=1 をn8n LaunchDaemonに設定し、再起動してからマージしてください')
          print('SHAMAN_CONCURRENCY_PREFLIGHT_OK')
          PY
      - name: JSON生成物とmainの一致を確認
        shell: bash
        run: |
          set -euo pipefail
          cd SHAMAN
          python3 generate_workflows.py
          cd ..
          git diff --exit-code -- SHAMAN/workflows/SHAMAN_Workflow.json SHAMAN/workflows/SHAMAN_Prompt_Eval.json \
            SHAMAN/workflows/SHAMAN_Connection_Check.json
      - name: Google Sheets版への移行を確認
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; w=json.load(open("SHAMAN/workflows/SHAMAN_Workflow.json", encoding="utf-8")); nodes={n["name"] for n in w["nodes"] if n["type"]=="n8n-nodes-base.googleSheets"}; queue={"Sites: Read Registry","Queue: Read","Queue: Recheck","Queue: Claim","Queue: Reread","Queue: Final Recheck","Queue: Update","Queue: Result Read"}; assert queue<=nodes, "Google Sheets版がmainにありません（PR #57を先にマージしてください）"; other=sorted(n for n in nodes-queue if not n.startswith("Usage: ")); assert not other, "想定外の Google Sheets ノード: %s" % other'
      - name: デプロイスクリプトの単体試験
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s SHAMAN/tools/luna -p 'test_deploy_shaman_google_sheets.py'
      - name: プロンプト評価WorkflowをAPI配備・読戻し・公開
        shell: bash
        env:
          N8N_DEPLOY_API_KEY: ${{ secrets.N8N_DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          python3 SHAMAN/tools/luna/deploy_shaman_google_sheets.py \
            --mode test --workflow SHAMAN/workflows/SHAMAN_Prompt_Eval.json --publish
      # 本番ワークフローを更新する前に、共有WordPress CredentialのSITE_ID別認証が実機で通るか検証する。
      # 2サイトを同じGETノードで順番に確認する。失敗するとstage-testが失敗し、publish-productionは実行しない。
      - name: WordPressサイト別認証の実機ゲート
        shell: bash
        env:
          SHAMAN_RUN_WEBHOOK_TOKEN: ${{ secrets.SHAMAN_RUN_WEBHOOK_TOKEN }}
          SHAMAN_EVAL_STEP: WP
          SHAMAN_EVAL_SITE_ID: kuro-aji-lab.com,kuromimi.online
          SHAMAN_EVAL_ROUNDS: "2"
          SHAMAN_EVAL_KEYWORD: ""
          SHAMAN_EVAL_OPTION1: ""
          SHAMAN_EVAL_INPUT_ID: ""
          SHAMAN_EVAL_BASELINE_ID: ""
          SHAMAN_EVAL_MODEL: ""
        run: |
          set -euo pipefail
          if [ -z "${SHAMAN_RUN_WEBHOOK_TOKEN:-}" ]; then
            echo "::error title=実機認証試験::SHAMAN_RUN_WEBHOOK_TOKENが未登録です"
            exit 1
          fi
          python3 SHAMAN/tools/luna/run_shaman_workflow.py --mode test
      # 実行は配備とは別に、Actions の「SHAMAN | n8n Workflow実行」から行う（run-shaman-n8n.yml、DOCS/RUN_FROM_ACTIONS.md）。

  # 接続確認Workflow（DOCS/CONNECTION_CHECK.md）。プロンプト評価の配備の成否に左右されない独立ジョブ。
  # 配備のゲート（オーナーによるmainへのマージだけ）はstage-testと同じ。実行は run-shaman-n8n.yml から行う。
  deploy-connection-check:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.merged_by.login == github.repository_owner &&
          github.event.pull_request.merged_by.type == 'User' &&
          github.event.sender.login == github.repository_owner &&
          github.event.sender.type == 'User' }}
    runs-on: [self-hosted, macOS, X64, shaman-deploy]
    timeout-minutes: 10
    # CredentialのIDはRepository Variableに登録しない。配備のスクリプトがn8nのCredentialの一覧から、
    # 種類で1件に決めて取る（同じ種類が2件以上のときだけ名前で選ぶ）。SHAMAN/IMGのIDはSHAMAN/config/drive.jsonに置く。
    env:
      N8N_BASE_URL: http://127.0.0.1:5678
      SHAMAN_QUEUE_SPREADSHEET_ID: ${{ vars.SHAMAN_QUEUE_SPREADSHEET_ID }}
      SHAMAN_QUEUE_TEST_SPREADSHEET_ID: ${{ vars.SHAMAN_QUEUE_TEST_SPREADSHEET_ID }}
      SHAMAN_MERGED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SHAMAN_MERGED_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: luna専用runnerと配備前提を検証
        shell: bash
        env:
          N8N_DEPLOY_API_KEY: ${{ secrets.N8N_DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != "luna-shaman-deploy" ]; then
            echo "::error title=接続確認の配備前提 C01::想定外のrunnerです"
            exit 1
          fi
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error title=接続確認の配備前提 C02::rootユーザーによる配備は禁止です"
            exit 1
          fi
          if [ -e /etc/shaman-ci-isolated ]; then
            echo "::error title=接続確認の配備前提 C03::CI隔離環境での配備を禁止します"
            exit 1
          fi
          if sudo -n true >/dev/null 2>&1; then
            echo "::error title=接続確認の配備前提 C04::runnerにパスワードなしsudo権限があります"
            exit 1
          fi
          if [ -z "${N8N_DEPLOY_API_KEY:-}" ]; then
            echo "::error title=接続確認の配備前提 C05::GitHub Secret N8N_DEPLOY_API_KEYが未登録です"
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 5 "$N8N_BASE_URL/healthz" >/dev/null; then
            echo "::error title=接続確認の配備前提 C06::luna上のn8n localhost:5678に接続できません"
            exit 1
          fi
          echo "SHAMAN_CONNECTION_CHECK_PREFLIGHT_OK"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: マージしたmainのコミットを確認
        shell: bash
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
          test "$GITHUB_SHA" = "$MERGED_SHA"
          main_sha="$(curl --fail --silent --show-error --max-time 10 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_READ_TOKEN" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$main_sha" = "$MERGED_SHA"
      - name: 接続確認WorkflowのJSONとmainの一致を確認
        shell: bash
        run: |
          set -euo pipefail
          cd SHAMAN
          python3 generate_workflows.py
          cd ..
          git diff --exit-code -- SHAMAN/workflows/SHAMAN_Connection_Check.json
      - name: 接続確認WorkflowをAPI配備・読戻し・公開
        shell: bash
        env:
          N8N_DEPLOY_API_KEY: ${{ secrets.N8N_DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          python3 SHAMAN/tools/luna/deploy_shaman_google_sheets.py \
            --mode connection --workflow SHAMAN/workflows/SHAMAN_Connection_Check.json --publish

  # 本番Workflow。公開しても、入口は合言葉付きのWebhookだけで、自動では動かない（実行は run-shaman-n8n.yml）。
  # 実行されてもWordPressには下書きで投稿する。プロンプト評価の配備が成功したときだけ配備する。
  publish-production:
    needs: stage-test
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.merged_by.login == github.repository_owner &&
          github.event.pull_request.merged_by.type == 'User' &&
          github.event.sender.login == github.repository_owner &&
          github.event.sender.type == 'User' }}
    runs-on: [self-hosted, macOS, X64, shaman-deploy]
    timeout-minutes: 15
    # CredentialのIDはRepository Variableに登録しない。配備のスクリプトがn8nのCredentialの一覧から、
    # 種類で1件に決めて取る（同じ種類が2件以上のときだけ名前で選ぶ）。SHAMAN/IMGのIDはSHAMAN/config/drive.jsonに置く。
    env:
      N8N_BASE_URL: http://127.0.0.1:5678
      SHAMAN_QUEUE_SPREADSHEET_ID: ${{ vars.SHAMAN_QUEUE_SPREADSHEET_ID }}
      SHAMAN_QUEUE_TEST_SPREADSHEET_ID: ${{ vars.SHAMAN_QUEUE_TEST_SPREADSHEET_ID }}
      SHAMAN_DRAFT_DIR: ${{ vars.SHAMAN_DRAFT_DIR }}
      SHAMAN_MERGED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SHAMAN_MERGED_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: luna専用runnerと本番公開前提を確認
        shell: bash
        env:
          N8N_DEPLOY_API_KEY: ${{ secrets.N8N_DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != "luna-shaman-deploy" ] || [ "$(id -u)" -eq 0 ]; then
            echo "::error title=本番配備前提 P01::専用runner以外またはrootからの配備は禁止です"
            exit 1
          fi
          if [ -e /etc/shaman-ci-isolated ] || sudo -n true >/dev/null 2>&1; then
            echo "::error title=本番配備前提 P02::runnerの隔離条件を満たしません"
            exit 1
          fi
          if [ -z "${N8N_DEPLOY_API_KEY:-}" ]; then
            echo "::error title=本番配備前提 P03::n8n APIキーが未登録です"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: マージしたmainのコミットを確認
        shell: bash
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$SHAMAN_MERGED_COMMIT_SHA"
          main_sha="$(curl --fail --silent --show-error --max-time 10 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_READ_TOKEN" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$main_sha" = "$GITHUB_SHA"
      - name: 本番Workflow API配備・公開・読戻し
        shell: bash
        env:
          N8N_DEPLOY_API_KEY: ${{ secrets.N8N_DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          python3 SHAMAN/tools/luna/deploy_shaman_google_sheets.py \
            --mode production --workflow SHAMAN/workflows/SHAMAN_Workflow.json --publish
      - name: 監視コード・専用Credentialを配備（LaunchDaemon登録は管理者が初回に実施）
        shell: bash
        env:
          N8N_DEPLOY_API_KEY: ${{ secrets.N8N_DEPLOY_API_KEY }}
          SHAMAN_RUN_WEBHOOK_TOKEN: ${{ secrets.SHAMAN_RUN_WEBHOOK_TOKEN }}
          SHAMAN_WATCHDOG_N8N_API_KEY: ${{ secrets.SHAMAN_WATCHDOG_N8N_API_KEY }}
          SHAMAN_WATCHDOG_DISCORD_WEBHOOK_URL: ${{ secrets.SHAMAN_WATCHDOG_DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 SHAMAN/tools/luna/install_shaman_watchdog.py
